name: Build Windows EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "TVBox接口生成工具" `
            --icon "app.ico" `
            --version-file "version.txt" `
            tvbox_gui.py

      - name: Verify artifact
        shell: pwsh
        run: |
          if (!(Test-Path "dist\TVBox接口生成工具.exe")) {
            Write-Error "EXE not found!"
            exit 1
          }
          Get-Item "dist\TVBox接口生成工具.exe" | Format-List Name, Length

      - name: Upload artifact (every build)
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Windows-EXE
          path: dist/TVBox接口生成工具.exe

      - name: Create Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TVBox接口生成工具.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create rolling release (main push)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: dist/TVBox接口生成工具.exe
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
